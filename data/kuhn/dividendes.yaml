# Dividendes de KUHN SAS à son actionnaire (KUHN Group SAS, puis Bucher Industries), rangés par
# EXERCICE : le dividende prélevé sur le bénéfice de l'exercice, versé l'année suivante.
# Les comptes ne le publient pas directement : il est reconstitué à l'euro près par la variation des
# réserves [DD + DG] (dividende versé en N+1 = résultat N − hausse des réserves en N+1). Chaque montant
# tombe sur un dividende rond par action et concorde avec les dividendes reçus déclarés par KUHN Group SAS.
# Montants en millions d'euros.
# Tant que le montant n'est pas publié : « estime: true » et une méthode, calculée dans
# layouts/partials/kuhn/donnees.html. Seule méthode prévue : « taux-moyen » = taux de distribution
# moyen des « sur » exercices précédents, appliqué au bénéfice de l'exercice.
