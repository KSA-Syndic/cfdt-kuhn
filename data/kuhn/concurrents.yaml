# Concurrents cotés de KUHN Group : chiffre d'affaires par exercice et marge publiée.
# Source : communiqués annuels des groupes (exercices fiscaux). Les définitions de marge diffèrent :
# John Deere = marge opérationnelle des activités équipement ; AGCO = marge opérationnelle ajustée ;
# CNH = marge d'EBIT ajusté des activités industrielles.
#   ca     chiffre d'affaires, dans l'unité du groupe
#   marge  marge publiée, en % (absente = non publiée sur une base comparable)

- nom: John Deere
  unite: Md$
  couleur: "#367C2B"
  note: "Ventes et revenus monde, exercice clos fin octobre. Marge des activités équipement."
  exercices:
    2021: { ca: 44.0 }
    2022: { ca: 52.6 }
    2023: { ca: 61.3, marge: 21.9 }
    2024: { ca: 51.7, marge: 18.2 }
    2025: { ca: 45.7, marge: 12.6 }

- nom: AGCO
