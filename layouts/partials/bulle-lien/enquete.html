{{- /* Dessin de la bulle « L'affaire des 2,6 % » : le tableau de liège de l'enquête, une fiche punaisée
       (la grande barre bleue, la petite rouge sous la loupe), un post-it, le fil rouge et le tampon
       (couleurs de static/interactifs/affaire-2-6/). */ -}}
<svg class="bulle-lien__dessin" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" focusable="false">
  <defs>
    <radialGradient id="bulle-punaise" cx=".35" cy=".3" r=".7">
      <stop offset="0" stop-color="#FF8A7A"/>
      <stop offset=".55" stop-color="#C0392B"/>
      <stop offset="1" stop-color="#7E1F14"/>
    </radialGradient>
    <pattern id="bulle-liege" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#FFFFFF" fill-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="240" height="180" fill="#12302F"/>
  <rect width="240" height="180" fill="url(#bulle-liege)"/>

  <!-- la fiche : du texte, puis deux barres -->
  <g transform="rotate(-4 74 90)">
    <rect x="28" y="36" width="94" height="110" rx="2" fill="#000000" fill-opacity=".28" transform="translate(2 4)"/>
    <rect x="28" y="36" width="94" height="110" rx="2" fill="#FBFBF8"/>
    <rect x="38" y="46" width="34" height="7" rx="1.5" fill="#2F6F9F" fill-opacity=".85"/>
    <path d="M38 62 H110 M38 70 H104 M38 78 H96" stroke="#C9C9C0" stroke-width="3" stroke-linecap="round"/>
    <path d="M38 132 H112" stroke="#8C8C84" stroke-width="1.5"/>
    <rect x="46" y="88" width="20" height="44" fill="#2F6F9F"/>
    <rect x="82" y="119" width="20" height="13" fill="#C0392B"/>
  </g>

  <!-- le post-it -->
  <g transform="rotate(6 172 58)">
    <rect x="142" y="30" width="62" height="56" fill="#000000" fill-opacity=".25" transform="translate(2 3)"/>
    <rect x="142" y="30" width="62" height="56" fill="#F7E37A"/>
    <path d="M152 48 C 160 45, 170 50, 180 46 S 192 47, 194 46 M152 60 C 158 57, 166 62, 176 58" fill="none" stroke="#2B2410" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M180 66 q4 -6 8 0 q-4 6 -1 9 M192 66 q4 -6 8 0 q-4 6 -1 9" fill="none" stroke="#2B2410" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- la conclusion, tamponnée -->
  <g transform="rotate(3 176 128)">
    <rect x="138" y="102" width="76" height="54" rx="2" fill="#000000" fill-opacity=".28" transform="translate(2 4)"/>
    <rect x="138" y="102" width="76" height="54" rx="2" fill="#FBFBF8"/>
    <path d="M147 140 H202 M147 148 H190" stroke="#C9C9C0" stroke-width="3" stroke-linecap="round"/>
    <g transform="rotate(-8 176 122)">
      <rect x="152" y="113" width="48" height="17" rx="1.5" fill="none" stroke="#E0574A" stroke-width="2.5"/>
      <path d="M158 121.5 H194" stroke="#E0574A" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 3"/>
    </g>
  </g>

  <!-- le fil rouge, d'une punaise à l'autre -->
  <g fill="none" stroke-linecap="round">
    <path d="M75 42 Q124 60 173 33 Q190 70 176 106" stroke="#000000" stroke-opacity=".3" stroke-width="2.4" transform="translate(1.5 3)"/>
    <path d="M75 42 Q124 60 173 33 Q190 70 176 106" stroke="#D9483B" stroke-width="2.2"/>
  </g>
  <g>
    <circle cx="76.5" cy="45" r="5.5" fill="#000000" fill-opacity=".35"/>
    <circle cx="75" cy="42" r="5.5" fill="url(#bulle-punaise)"/>
    <circle cx="174.5" cy="36" r="5.5" fill="#000000" fill-opacity=".35"/>
    <circle cx="173" cy="33" r="5.5" fill="url(#bulle-punaise)"/>
    <circle cx="177.5" cy="109" r="5.5" fill="#000000" fill-opacity=".35"/>
    <circle cx="176" cy="106" r="5.5" fill="url(#bulle-punaise)"/>
  </g>

  <!-- la loupe, posée sur la petite barre rouge -->
  <g>
    <path d="M110 140 L128 160" stroke="#000000" stroke-opacity=".3" stroke-width="10" stroke-linecap="round" transform="translate(2 4)"/>
    <path d="M110 140 L128 160" stroke="#6B4423" stroke-width="10" stroke-linecap="round"/>
    <path d="M110.5 140.5 L113 143.5" stroke="#2B2F35" stroke-width="11" stroke-linecap="butt"/>
    <circle cx="94" cy="122" r="23" fill="#DDEBF2" fill-opacity=".22" stroke="#2B2F35" stroke-width="5"/>
    <path d="M80 112 A17 17 0 0 1 92 104" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
